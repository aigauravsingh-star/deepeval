name: Validate System One batching fix

on:
  push:
    branches:
      - validate/system-one-batch-model-identity

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CONFIDENT_TELEMETRY_OPT_OUT: "YES"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      DEEPEVAL_DISABLE_DOTENV: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: >-
          python -m pip install -e . "openai==1.109.1"
          "pydantic==2.12.5" "pytest==9.0.2" "mcp[cli]==1.26.0"
          Pillow "black==25.12.0"
      - name: Check formatting
        run: >-
          python -m black --check --diff
          deepeval/metrics/utils/system_one_batch.py
          tests/test_metrics/test_system_one_batch.py
      - name: Demonstrate failures on upstream implementation
        shell: bash
        run: |
          cp deepeval/metrics/utils/system_one_batch.py "$RUNNER_TEMP/fixed-system-one-batch.py"
          git show 727203702cddf68e4f01a6ef95b23d9cb9036654:deepeval/metrics/utils/system_one_batch.py > deepeval/metrics/utils/system_one_batch.py
          set +e
          python -m pytest -p pytest_asyncio.plugin -p no:cacheprovider -q \
            tests/test_metrics/test_system_one_batch.py \
            -k 'custom_models_with_same_name or typesafe_models_with_different_configurations or typesafe_subclasses_with_same_config' \
            --junitxml=baseline.xml
          status=$?
          set -e
          cp "$RUNNER_TEMP/fixed-system-one-batch.py" deepeval/metrics/utils/system_one_batch.py
          test "$status" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("baseline.xml").findall(".//testcase")
          assert len(cases) == 12, len(cases)
          for case in cases:
              failure = case.find("failure")
              assert failure is not None, ET.tostring(case, encoding="unicode")
              assert case.find("error") is None
              assert "assert 0 == 1" in failure.get("message", "")
          print("All 12 regressions fail because the second backend is never called.")
          PY
      - name: Test the fix and related System One behavior
        run: >-
          python -m pytest -p pytest_asyncio.plugin -p no:cacheprovider -q
          tests/test_metrics/test_system_one_batch.py
          tests/test_metrics/test_jev_eval.py
          tests/test_metrics/test_conversational_jev_eval.py
          tests/test_metrics/test_eval_mode.py
          tests/test_metrics/test_eval_mode_shared.py
          tests/test_metrics/test_eval_mode_metrics.py
          --junitxml=fixed.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.python-version }}
          path: |
            baseline.xml
            fixed.xml
